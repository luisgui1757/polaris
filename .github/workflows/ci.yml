name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck bats
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install jq bats-core shellcheck
      - name: Gate (leak scan + render smoke + adapter drift)
        run: make ci
      - name: Tooling tests (bats)
        run: make test
      - name: ShellCheck (advisory)
        continue-on-error: true
        run: make lint-shell

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
        with:
          fetch-depth: 0   # gitleaks scans full history
      - name: Install linters
        run: |
          set -euxo pipefail
          python3 -m pip install --user yamllint==1.38.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Each pinned version travels with its asset sha256: download, verify,
          # then extract. A yanked/retagged/tampered upstream asset fails loudly
          # instead of silently executing in CI.
          ec_ver=3.7.0
          ec_sha=9a0c3a5170bffa24f9e5f0def53d285777b6c5284a95367f40d399d0b76af552
          curl -fsSL -o ec.tar.gz "https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v${ec_ver}/ec-linux-amd64.tar.gz"
          echo "${ec_sha}  ec.tar.gz" | sha256sum -c -
          tar -xzf ec.tar.gz
          sudo install -m 0755 bin/ec-linux-amd64 /usr/local/bin/editorconfig-checker
          gl_ver=8.30.1
          gl_sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${gl_ver}/gitleaks_${gl_ver}_linux_x64.tar.gz"
          echo "${gl_sha}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Lint (yaml + editorconfig + secrets)
        run: make lint

  # Stable required-status-check context. The branch-protection rulesets require
  # `ci`. It runs ALWAYS (so the required context is never reported as "skipped",
  # which some GitHub configs treat as passing) and FAILS unless every matrix
  # `test` job AND the `lint` job succeeded.
  ci:
    name: ci
    needs: [test, lint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all prerequisite jobs to have succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.lint.result }}" != "success" ]; then
            echo "test=${{ needs.test.result }} lint=${{ needs.lint.result }} -- failing the required ci check" >&2
            exit 1
          fi
          echo "all prerequisite jobs passed"
