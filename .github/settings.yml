# Synced by the Probot Settings app: https://probot.github.io/apps/settings/
# Live rulesets and GitHub-native controls are applied and verified by
# scripts/apply-repo-safeguards.sh. Branch policy has one source of truth:
# .github/rulesets/. Do not add overlapping classic branch protection here.

repository:
  allow_merge_commit: false
  allow_squash_merge: true
  allow_rebase_merge: false
  allow_auto_merge: false
  delete_branch_on_merge: true
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true
