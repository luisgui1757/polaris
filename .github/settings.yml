# Synced by the Probot Settings app: https://probot.github.io/apps/settings/
# Alternative one-shot path: scripts/apply-repo-safeguards.sh

repository:
  allow_merge_commit: false
  allow_squash_merge: true
  allow_rebase_merge: false
  delete_branch_on_merge: true
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true

branches:
  - name: main
    protection:
      required_status_checks:
        strict: true
        contexts:
          - ci
      # enforce_admins is false BY DESIGN so the codeowner can override a
      # failing/missing `ci` check and self-merge. Only the owner is a bypass
      # actor in the .github/rulesets, so external PRs are fully gated (mandatory
      # code-owner review + required `ci`). This posture is intentional and is
      # KEPT in public -- do not remove the owner bypass.
      enforce_admins: false
      required_pull_request_reviews: null
      required_linear_history: true
      required_conversation_resolution: true
      restrictions: null
      allow_force_pushes: false
      allow_deletions: false
